<script>
// SAFE FIXES - outside your original code, cannot make blank
// 1. Save users to Firebase
(function(){
  const originalSetItem = localStorage.setItem;
  localStorage.setItem = function(k,v){
    originalSetItem.call(this,k,v);
    if(k==="sg_users"){
      try{
        fetch("https://sec-gen-default-rtdb.europe-west1.firebasedatabase.app/users.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:v});
      }catch{}
    }
  };
})();
// 2. Auto-refresh every 10sec - never blanks
setInterval(async()=>{
  try{
    let r = await fetch("https://sec-gen-default-rtdb.europe-west1.firebasedatabase.app/products.json",{cache:"no-store"});
    if(r.ok){
      let d = await r.json();
      if(d){
        let a = Array.isArray(d)?d:Object.values(d);
        if(a.length>0) localStorage.setItem("sg_products", JSON.stringify(a.slice(0,50)));
      }
    }
  }catch{}
},10000);
</script>
